name: Verify homepage context live

on:
  push:
    branches: [verify-home-context-live]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check live homepage context
        run: |
          set -euxo pipefail
          PAGE="$(curl -fsS --max-time 20 https://yamans86.github.io/anticipatory-action/)"
          grep -q "What this project is" <<<"$PAGE"
          grep -q "Canada is the first pilot" <<<"$PAGE"
          grep -q "Everything is designed to be inspectable" <<<"$PAGE"
