name: Verify production URL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages and verify public routes
        shell: bash
        run: |
          set -u
          BASE="https://yamans86.github.io/anticipatory-action"
          ok=0
          for attempt in {1..24}; do
            home="$(curl -fsS --max-time 15 "$BASE/" 2>/dev/null || true)"
            health="$(curl -fsS --max-time 15 "$BASE/health.json" 2>/dev/null || true)"
            canada="$(curl -fsS --max-time 15 "$BASE/countries/CA" 2>/dev/null || true)"
            evidence="$(curl -fsS --max-time 15 "$BASE/evidence" 2>/dev/null || true)"
            poc="$(curl -fsS --max-time 15 "$BASE/canada-poc" 2>/dev/null || true)"
            if grep -q "Understand change" <<<"$home" \
              && grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' <<<"$health" \
              && grep -q "Canada Lab" <<<"$canada" \
              && grep -q "Evidence and data" <<<"$evidence" \
              && grep -q "SHARE WITH CAVEATS" <<<"$poc" \
              && grep -q "NOT TRIGGERED" <<<"$poc"; then
              echo "Production smoke test passed on attempt $attempt"
              ok=1
              break
            fi
            echo "Attempt $attempt did not pass yet"
            sleep 5
          done

          if [[ "$ok" -ne 1 ]]; then
            echo "Production smoke test failed"
            echo "--- HOME HEADERS/BODY ---"
            curl -i --max-time 20 "$BASE/" || true
            echo "--- HEALTH HEADERS/BODY ---"
            curl -i --max-time 20 "$BASE/health.json" || true
            echo "--- CANADA HEADERS/BODY ---"
            curl -i --max-time 20 "$BASE/countries/CA" || true
            echo "--- EVIDENCE HEADERS/BODY ---"
            curl -i --max-time 20 "$BASE/evidence" || true
            echo "--- CANADA POC HEADERS/BODY ---"
            curl -i --max-time 20 "$BASE/canada-poc" || true
            exit 1
          fi
